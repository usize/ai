# Standalone benchmark mock — intentionally NOT a member of the repo workspace
# so it does not affect the main build/lint/audit and containerizes on its own.
# The empty [workspace] table makes this its own workspace root.
[workspace]

[package]
name = "bench-mock-llm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mock-llm"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
