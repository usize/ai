# Praxis AI — Benchmark Tier T1: parse request body + route by model.
#
# The AI work at this tier: read the JSON request body, extract the "model"
# field, and route to the matching upstream cluster. model_to_header promotes
# the model into X-AI-Model (parsing the body with early-exit); the router
# then selects a cluster by that header. This exercises Praxis's request-body
# parse+route path with no token counting (that is T2).
#
# Upstream is the benchmark mock LLM. The load generator sends
# "model": "bench-model-a"; unknown models fall through to the same mock so a
# misconfigured request never skews results with a routing miss.
#
# Run (standalone, for local checks):
#   cargo run -p praxis-ai-proxy -- -c bench/engines/praxis/t1.yaml

listeners:
  - name: gateway
    address: "0.0.0.0:8080"
    filter_chains:
      - extract-model
      - routing

filter_chains:
  # Parse the JSON body and promote "model" to X-AI-Model.
  - name: extract-model
    filters:
      - filter: model_to_header
        header: X-AI-Model

  # Route on the promoted header to a named cluster.
  - name: routing
    filters:
      - filter: router
        routes:
          - path_prefix: "/"
            headers:
              x-ai-model: "bench-model-a"
            cluster: model-a
          - path_prefix: "/"
            headers:
              x-ai-model: "bench-model-b"
            cluster: model-b
          - path_prefix: "/"
            cluster: model-a
      - filter: load_balancer
        clusters:
          - name: model-a
            endpoints:
              - "mock-llm:9000"
          - name: model-b
            endpoints:
              - "mock-llm:9000"

insecure_options:
  allow_private_endpoints: true # benchmark proxies to a local mock
