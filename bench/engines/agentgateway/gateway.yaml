# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway — benchmark configuration.
#
# The measured processing path: parse the request body, route by the "model"
# field, and count tokens. agentgateway's `llm:` mode does all three as one
# data path. Token counting uses provider-returned usage; `tokenize: false`
# keeps agentgateway's local tiktoken path OFF, matching the fairness rule
# that every engine uses provider usage only.
#
# Upstream is the benchmark mock LLM. `baseUrl` expands to host + port + tls,
# and an http:// URL selects plaintext to the upstream.
#
# Verified against agentgateway v1.5.0
# (ghcr.io/agentgateway/agentgateway@sha256:bf2f339ef326d32def2aaeb44b1b4549801293c19b89e764a4228667d97d9896)
# with `--validate-only` and a live request through the mock.
#
# Run (standalone, for local checks):
#   agentgateway -f bench/engines/agentgateway/gateway.yaml

llm:
  port: 3000
  models:
    - name: bench-model-a
      provider: openAI
      params:
        baseUrl: http://mock-llm:9000
        apiKey: bench-key
        tokenize: false # provider-usage only; local tokenization off (fairness rule)
    - name: bench-model-b
      provider: openAI
      params:
        baseUrl: http://mock-llm:9000
        apiKey: bench-key
        tokenize: false
